          background:#0E1B2E; padding:24px; }

          font-family:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif; }

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  :root {
    --navy:#16263F; --navy-deep:#0E1B2E; --navy-soft:#22385A;
    --paper:#FAF7F1; --cream:#F1ECE1; --card:#FFFFFF;
    --ink:#16263F; --ink-2:#495B75; --muted:#7A889E;
    --line:#DED7C8; --line-soft:#EBE5D9;
    --terra:#B8512F; --terra-lift:#D2673F; --terra-wash:#F6E7DF;
    --good:#2F6B50; --good-wash:#E2EFE7;
    --warn:#97681B; --warn-wash:#F6EBD5;
    --crit:#8C2F26; --crit-wash:#F6E0DC;
    --shadow: 0 1px 2px rgba(22,38,63,.06), 0 8px 24px -16px rgba(22,38,63,.35);
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
    --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --navy:#0D1727; --navy-deep:#08101C; --navy-soft:#1B2C46;
      --paper:#0D1727; --cream:#142238; --card:#15243A;
      --ink:#EDE7DA; --ink-2:#B9C2D2; --muted:#8595AC;
      --line:#27384F; --line-soft:#1E2E44;
      --terra:#E0805B; --terra-lift:#EE9573; --terra-wash:#33221B;
      --good:#6FBF95; --good-wash:#162C22;
      --warn:#D8AC5E; --warn-wash:#2E2415;
      --crit:#E2867B; --crit-wash:#331D1A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"] {
    --navy:#0D1727; --navy-deep:#08101C; --navy-soft:#1B2C46;
    --paper:#0D1727; --cream:#142238; --card:#15243A;
    --ink:#EDE7DA; --ink-2:#B9C2D2; --muted:#8595AC;
    --line:#27384F; --line-soft:#1E2E44;
    --terra:#E0805B; --terra-lift:#EE9573; --terra-wash:#33221B;
    --good:#6FBF95; --good-wash:#162C22;
    --warn:#D8AC5E; --warn-wash:#2E2415;
    --crit:#E2867B; --crit-wash:#331D1A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.9);
  }

  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--terra); outline-offset: 2px; border-radius: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .mast { background: var(--navy-deep); color:#F1ECE1; border-bottom: 3px solid var(--terra); }
  .mast-in { max-width:1180px; margin:0 auto; padding:20px 20px 0; display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; justify-content:space-between; }
  .wordmark { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .wordmark h1 { font-family:var(--cond); font-weight:700; font-size:30px; letter-spacing:-.01em; margin:0; color:#F5F1E8; }
  .wordmark .firm { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:#8FA2BC; }
  .mast-meta { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .nextmeet { font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#8FA2BC; }
  .nextmeet b { color:#F1ECE1; font-weight:600; }
  #whoami { display:block; margin-top:4px; color:#8FA2BC; text-transform:none; letter-spacing:.04em; }
  #whoami b { color:#E0805B; font-weight:600; }
  .refresh-pod { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.12); border-radius:3px; padding:7px 8px 7px 12px; }
  .refresh-pod .rtxt { font-family:var(--mono); font-size:11px; line-height:1.35; color:#C3CEDD; text-align:right; }
  .refresh-pod .rtxt b { display:block; color:#F1ECE1; font-weight:500; }
  .btn-refresh { background:var(--terra); color:#fff; border:0; border-radius:2px; padding:7px 13px; font-family:var(--cond); font-weight:600; font-size:13px; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; white-space:nowrap; }
  .btn-refresh:hover:not(:disabled) { background: var(--terra-lift); }
  .btn-refresh:disabled { background: rgba(255,255,255,.14); color:#92A3BA; cursor: default; }

  .tabs { max-width:1180px; margin:0 auto; padding:16px 20px 0; display:flex; gap:2px; overflow-x:auto; }
  .tab { background:transparent; border:0; border-bottom:3px solid transparent; color:#92A3BA; padding:9px 13px 10px; cursor:pointer; white-space:nowrap; font-family:var(--cond); font-weight:600; font-size:13.5px; letter-spacing:.05em; text-transform:uppercase; margin-bottom:-3px; }
  .tab:hover { color:#D7DEE8; }
  .tab[aria-selected="true"] { color:#FFF; border-bottom-color: var(--terra); }
  .tab .ct { font-family:var(--mono); font-size:10px; opacity:.7; margin-left:5px; }
  .tab .n { font-family:var(--mono); font-size:10px; opacity:.6; margin-right:6px; }

  .wrap { max-width:1180px; margin:0 auto; padding-inline:20px; padding-block:28px 64px; }
  .banner { border:1px solid var(--line); background:var(--warn-wash); color:var(--warn); border-left:3px solid var(--warn); border-radius:2px; padding:11px 14px; margin-bottom:22px; font-size:13.5px; }

  .section-hd { display:flex; flex-wrap:wrap; gap:8px 20px; align-items:baseline; margin-bottom:6px; }
  .section-hd .hdnum { font-family:var(--mono); font-size:13px; color:var(--terra); }
  .section-hd h2 { font-family:var(--cond); font-weight:700; font-size:25px; margin:0; }
  .section-hd .seg-time { font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
  .section-sub { color:var(--muted); font-size:13.5px; margin:0 0 22px; max-width:60ch; font-style:italic; padding-bottom:16px; border-bottom:1px solid var(--line); }

  /* run of show index */
  .agenda { border-top:1px solid var(--line); }
  .arow {
    display:grid; grid-template-columns:46px 1fr auto; gap:0 16px; align-items:start;
    width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--line-soft);
    padding:18px 4px; cursor:pointer;
  }
  .arow:hover { background: var(--cream); }
  .arow .anum { font-family:var(--mono); font-size:13px; color:var(--terra); padding-top:2px; }
  .arow h3 { font-family:var(--cond); font-weight:700; font-size:19px; margin:0 0 3px; display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; }
  .arow h3 .seg-time { font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-weight:400; }
  .arow p { margin:0; color:var(--muted); font-size:13.5px; max-width:62ch; }
  .arow .peek { margin:8px 0 0; padding-left:0; list-style:none; }
  .arow .peek li { position:relative; padding-left:14px; font-size:13px; color:var(--ink-2); margin-bottom:4px; }
  .arow .peek li::before { content:""; position:absolute; left:2px; top:.6em; width:4px; height:4px; border-radius:50%; background:var(--terra); }
  .acount { font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; padding-top:5px; letter-spacing:.04em; }
  .acount b { color:var(--terra); font-weight:600; }

  .item { display:flex; gap:11px; align-items:flex-start; background:var(--card); border:1px solid var(--line-soft); border-radius:3px; padding:11px 13px; box-shadow:var(--shadow); }
  .item + .item { margin-top:8px; }
  .item.is-done { background:transparent; box-shadow:none; border-style:dashed; }
  .item.is-done .item-text { color:var(--muted); text-decoration:line-through; }
  .tick { flex:none; width:17px; height:17px; margin-top:2px; cursor:pointer; border:1.5px solid var(--muted); border-radius:2px; background:transparent; display:grid; place-items:center; padding:0; }
  .tick:hover { border-color: var(--terra); }
  .tick[aria-pressed="true"] { background:var(--good); border-color:var(--good); }
  .tick svg { display:block; opacity:0; }
  .tick[aria-pressed="true"] svg { opacity:1; }
  .item-main { flex:1 1 auto; min-width:0; }
  .item-text { margin:0; overflow-wrap:anywhere; }
  .item-meta { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:5px; font-family:var(--mono); font-size:10.5px; color:var(--muted); letter-spacing:.03em; }
  .item-kill { flex:none; background:transparent; border:0; color:var(--muted); cursor:pointer; font-size:17px; line-height:1; padding:2px 4px; border-radius:2px; }
  .item-kill:hover { color:var(--crit); background:var(--crit-wash); }

  .empty { color:var(--muted); font-size:13.5px; padding:6px 0 2px; font-style:italic; }
  .covered-toggle { display:block; background:transparent; border:0; padding:10px 0 4px; cursor:pointer; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .covered-toggle:hover { color: var(--terra); }

  .qadd { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .qadd input[type="text"] { flex:1 1 200px; min-width:0; padding:9px 11px; border:1px solid var(--line); border-radius:3px; background:var(--card); }
  .qadd input[type="text"]::placeholder { color: var(--muted); }
  .qadd select, .qadd input[type="date"] { padding:9px; border:1px solid var(--line); border-radius:3px; background:var(--card); font-family:var(--mono); font-size:12px; }
  .btn { background:var(--navy); color:#F1ECE1; border:0; border-radius:3px; padding:9px 16px; cursor:pointer; font-family:var(--cond); font-weight:600; font-size:13.5px; letter-spacing:.04em; text-transform:uppercase; }
  .btn:hover { background: var(--navy-soft); }
  .btn.ghost { background:transparent; color:var(--ink-2); border:1px solid var(--line); }
  .btn.ghost:hover { background:var(--cream); color:var(--ink); }

  .pill { display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:3px 7px; border-radius:2px; white-space:nowrap; }
  .pill.active{background:var(--good-wash);color:var(--good)} .pill.winding{background:var(--warn-wash);color:var(--warn)}
  .pill.prospect{background:var(--terra-wash);color:var(--terra)} .pill.paused{background:var(--cream);color:var(--muted)}
  .pill.out{background:var(--terra-wash);color:var(--terra)} .pill.drafting{background:var(--cream);color:var(--ink-2)}
  .pill.verbal{background:var(--warn-wash);color:var(--warn)} .pill.won{background:var(--good-wash);color:var(--good)}
  .pill.lost{background:var(--crit-wash);color:var(--crit)}

  .subhd { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:34px 0 12px; padding-bottom:7px; border-bottom:1px solid var(--line); }
  .subhd:first-child { margin-top: 0; }

  .clients { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px,1fr)); gap:16px; align-items:start; }
  .ccard { background:var(--card); border:1px solid var(--line-soft); border-radius:3px; box-shadow:var(--shadow); overflow:hidden; }
  .ccard-top { padding:14px 16px 12px; border-bottom:1px solid var(--line-soft); display:flex; gap:10px; align-items:flex-start; justify-content:space-between; }
  .ccard-top h3 { font-family:var(--cond); font-weight:700; font-size:17px; margin:0 0 3px; }
  .ccard-lead { font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .ccard-body { padding:14px 16px 16px; }
  .pulse { margin:0; padding:12px 16px; background:var(--terra-wash); color:var(--ink); font-size:14px; border-bottom:1px solid var(--line-soft); }
  .cnotes { border-top:1px dashed var(--line); padding-top:12px; margin-top:14px; }
  .cnotes .item { box-shadow:none; background:var(--paper); }
  .cnotes .qadd { margin-top:10px; }
  .cnotes .qadd input[type="text"] { flex:1 1 140px; padding:7px 10px; font-size:13.5px; }
  .cnotes .qadd .btn { padding:7px 12px; font-size:12.5px; }
  .rlabel { font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .recap-list { margin:0; padding-left:0; list-style:none; }
  .recap-list li { position:relative; padding-left:15px; margin-bottom:7px; font-size:13.5px; color:var(--ink-2); overflow-wrap:anywhere; }
  .recap-list li::before { content:""; position:absolute; left:2px; top:.62em; width:5px; height:5px; border-radius:50%; background:var(--terra); }
  .recap-list li:last-child { margin-bottom:0; }
  .recap.blank { font-style:italic; color:var(--muted); font-size:13.5px; margin:0; }
  .nextact { border-top:1px dashed var(--line); padding-top:12px; margin-top:14px; }
  .nextact textarea { width:100%; border:1px solid var(--line); border-radius:3px; background:var(--paper); padding:8px 10px; resize:vertical; min-height:52px; font-size:13.5px; }

  .group { margin-bottom:38px; }
  .group-hd { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--terra); }
  .group-hd h3 { font-family:var(--cond); font-weight:700; font-size:18px; margin:0; }
  .group-hd p { margin:0; color:var(--muted); font-size:13px; }

  .tablewrap { overflow-x:auto; border:1px solid var(--line-soft); border-radius:3px; background:var(--card); box-shadow:var(--shadow); }
  table { border-collapse:collapse; width:100%; min-width:680px; }
  th { font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); text-align:left; font-weight:500; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:12px 14px; border-bottom:1px solid var(--line-soft); vertical-align:top; font-size:14px; }
  tr:last-child td { border-bottom:0; }
  td.num { font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink-2); }
  td .cname { font-weight:600; display:block; }
  td .ctitle { color:var(--ink-2); font-size:13px; }
  td select { background:transparent; border:1px solid var(--line); border-radius:2px; padding:4px 6px; font-family:var(--mono); font-size:11px; }
  td input.inline { width:100%; min-width:140px; background:transparent; border:0; border-bottom:1px dashed var(--line); padding:3px 0; font-size:13.5px; }
  td input.inline:focus { border-bottom-color:var(--terra); outline:none; }

  .parklot { margin-top:40px; padding-top:4px; border-top:2px solid var(--terra); }
  .parklot .subhd { margin-top:18px; color:var(--terra); }
  .parklot-note { margin:0 0 16px; color:var(--muted); font-size:13.5px; font-style:italic; max-width:62ch; }
  .month { margin-bottom:26px; }
  .month h3 { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--terra); margin:0 0 10px; padding-bottom:7px; border-bottom:1px solid var(--line); }

  @media (max-width: 620px) {
    .mast-meta { align-items:flex-start; }
    .mast-in { flex-direction:column; }
    .wordmark h1 { font-size:26px; }
    .arow { grid-template-columns:32px 1fr; }
    .acount { grid-column:2; padding-top:8px; }
  }
</style>

<header class="mast">
  <div class="mast-in">
    <div class="wordmark">
      <h1>Base Camp</h1>
      <span class="firm">Plan&nbsp;+&nbsp;Pivot Collective</span>
    </div>
    <div class="mast-meta">
      <div class="nextmeet">Touch base &middot; <b id="meetDate">&mdash;</b><span id="whoami"></span></div>
      <div class="refresh-pod">
        <div class="rtxt" id="refreshTxt"><b>Recaps</b>never refreshed</div>
        <button class="btn-refresh" id="refreshBtn" type="button">Refresh recaps</button>
      </div>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Base Camp sections" id="tabbar"></nav>
</header>

<main class="wrap">
  <div class="banner" id="banner" hidden></div>
  <div id="stage"></div>
</main>

<script>
(function () {
  "use strict";

  var SECTIONS = [
    { key:"swallow", num:"01", name:"Let It Out or Sweat It Out", tab:"Let It Out", time:"5 min",
      note:"Did you swallow something this week you should have said out loud? Not like that, pervert." },
    { key:"clients", num:"02", name:"Client Review", tab:"Clients", time:"",
      note:"Tick through every active client. Say the thing even if it's fine." },
    { key:"scopes", num:"03", name:"Prospective Clients", tab:"Prospects", time:"",
      note:"What's quoted, who's warm, who got away and might not have to stay away." },
    { key:"socials", num:"04", name:"Socials", tab:"Socials", time:"",
      note:"What went out, what landed, what's queued. Two posts a week is the standing commitment." },
    { key:"financials", num:"05", name:"Financials", tab:"Financials", time:"",
      note:"Invoiced, collected, outstanding. What's owed to us and what we owe." },
    { key:"catchall", num:"06", name:"Catch-All", tab:"Catch-All", time:"",
      note:"Miscellaneous. Everything that didn't have a home." }
  ];
  var SECTION_BY_KEY = {};
  SECTIONS.forEach(function (s) { SECTION_BY_KEY[s.key] = s; });

  var SCOPE_STATUS = ["drafting","out","verbal","won","lost"];
  var CLIENT_ORDER = { active:0, winding:1, prospect:2, paused:3 };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];

  function uid() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var p = String(iso).slice(0,10).split("-");
    if (p.length !== 3) return iso;
    return new Date(Number(p[0]), Number(p[1])-1, Number(p[2]))
      .toLocaleDateString(undefined, { month:"short", day:"numeric" });
  }
  function fmtStamp(ts) {
    if (!ts) return null;
    var d = new Date(ts);
    if (isNaN(d)) return null;

           d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
  }
  function nextTouchBase() {
    var d = new Date();

  function dueNow(it) { return it.status !== "dropped" && (!it.surfaceOn || it.surfaceOn <= todayISO()); }

  function itemHTML(it, opts) {
    var done = it.status === "done", meta = [];
    var adder = who(it.addedBy);
    var added = it.addedAt ? fmtDate(it.addedAt.slice(0,10)) : "";
    if (adder) meta.push("added by " + esc(adder) + (added ? " · " + esc(added) : ""));
    else if (added) meta.push("added " + esc(added));
    if (it.surfaceOn) meta.push("parked for " + esc(fmtDate(it.surfaceOn)));
    if (opts && opts.showSection && SECTION_BY_KEY[it.section]) meta.push(esc(SECTION_BY_KEY[it.section].name));
    if (done && it.doneAt) {

    return '<div class="item' + (done ? " is-done" : "") + '">' +

  /* ---------- Run of Show: the index ---------- */
  function renderRun() {
    var rows = SECTIONS.map(function (s) {
      var open = openIn(s.key), done = doneIn(s.key);

        var n = state.clients.filter(function (c) { return c.status === "active" || c.status === "winding"; }).length;
        extra = n + " to tick through";
      } else if (s.key === "scopes") {

          return p.category === "scope" && ["drafting","out","verbal"].indexOf(p.status) >= 0;
        }).length;

      var count = open.length ? "<b>" + open.length + "</b> open" : (done.length ? done.length + " covered" : "nothing raised");

      return '<button class="arow" type="button" data-go="' + s.key + '">' +
        '<span class="anum">' + s.num + '</span>' +
        '<span><h3>' + esc(s.name) + (s.time ? '<span class="seg-time">' + esc(s.time) + '</span>' : "") + '</h3>' +
        '<p>' + esc(s.note) + '</p>' +
        (peek ? '<ul class="peek">' + peek + (open.length > 3 ? "<li>and " + (open.length - 3) + " more</li>" : "") + "</ul>" : "") +
        '</span>' +
        '<span class="acount">' + count + (extra ? "<br>" + esc(extra) : "") + '</span>' +

    return '<div class="section-hd"><h2>Run of Show</h2></div>' +

  /* ---------- a section tab ---------- */

  function renderStage() {
    var stage = el("stage");

    // Preserve what the user is mid-way through typing. A snapshot from the
    // shared database re-renders this whole panel, and without this the text
    // in an add box or a next-action field disappears as you type.
    var scratch = {}, activeKey = null, caret = null;
    Array.prototype.forEach.call(stage.querySelectorAll("input, textarea"), function (f) {
      var k = fieldKey(f);
      if (k && f.closest(".qadd")) scratch[k] = f.value;
    });
    var ae = document.activeElement;
    if (ae && stage.contains(ae) && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) {
      activeKey = fieldKey(ae);
      if (activeKey) scratch[activeKey] = ae.value;
      try { caret = ae.selectionStart; } catch (e) {}
    }

    if (SECTION_BY_KEY[view]) stage.innerHTML = renderSection(view);
    else stage.innerHTML = renderRun();

    Array.prototype.forEach.call(stage.querySelectorAll("input, textarea"), function (f) {
      var k = fieldKey(f);
      if (!k) return;
      if (scratch[k] !== undefined && scratch[k] !== f.value) f.value = scratch[k];
      if (k === activeKey) {
        try { f.focus(); if (caret != null) f.setSelectionRange(caret, caret); } catch (e) {}
      }
    });
  }

  /* ============================================================
     Supabase wiring. Replaces the artifact runtime with the same
     shape (doc/collection/onSnapshot) so nothing above had to change.

  function supaDb(sb) {
    var TABLE = { clients:"bc_clients", prospects:"bc_prospects", agenda:"bc_agenda", meta:"bc_meta" };
    function tbl(name) { return TABLE[name] || ("bc_" + name); }

    function watch(table, handler) {
      function pull() {
        sb.from(table).select("id,data").then(function (r) {
          if (r.error) { console.warn(table, r.error.message); return; }
          handler(r.data || []);
        });
      }
      pull();
      sb.channel("bc-" + table)
        .on("postgres_changes", { event:"*", schema:"public", table:table }, pull)
        .subscribe();
      return pull;
    }

    return {
      doc: function (path) {
        var p = path.split("/"), table = tbl(p[0]), id = p.slice(1).join("/");
        return {
          set: function (d) {
            return sb.from(table).upsert({ id:id, data:d })
              .then(function (r) { if (r.error) throw { code:"unavailable", message:r.error.message }; });
          },
          update: function (patch) {
            return sb.from(table).select("data").eq("id", id).maybeSingle().then(function (r) {
              var cur = (r.data && r.data.data) || {};
              for (var k in patch) cur[k] = patch[k];
              return sb.from(table).upsert({ id:id, data:cur }).then(function (w) {
                if (w.error) throw { code:"unavailable", message:w.error.message };
              });
            });
          },
          delete: function () {
            return sb.from(table).delete().eq("id", id)
              .then(function (r) { if (r.error) throw { code:"unavailable", message:r.error.message }; });
          },
          onSnapshot: function (next) {
            watch(table, function (rows) {
              var hit = null;
              for (var i = 0; i < rows.length; i++) if (rows[i].id === id) hit = rows[i];
              next({ exists: !!hit, data: function () { return hit ? hit.data : undefined; } });
            });
            return function () {};
          }
        };
      },
      collection: function (name) {
        var table = tbl(name);
        return {
          onSnapshot: function (next) {
            watch(table, function (rows) {
              next({ docs: rows.map(function (r) {
                return { id:r.id, data: function () { return r.data; } };
              }) });
            });
            return function () {};
          }
        };
      }
    };
  }

  /* Who is using it. No sign-in on a static host, so we ask once and
     remember, which is what makes "added by Julie" work. */
  var PEOPLE = { carolyn:"Carolyn MacBain-Waldo", julie:"Julie McCarter" };

  function askWho() {
    return new Promise(function (resolve) {
      var saved = null;
      try { saved = localStorage.getItem("basecamp.who"); } catch (e) {}
      if (saved && PEOPLE[saved]) return resolve(saved);
      var gate = el("gate");

        '<p>So your additions get your name on them.</p>' +
        '<div class="gate-row">' +

        '<button class="btn" data-who="julie" type="button">Julie</button>' +
        '</div></div>';
      gate.addEventListener("click", function (e) {
        var b = e.target.closest("[data-who]");
        if (!b) return;
        try { localStorage.setItem("basecamp.who", b.dataset.who); } catch (e2) {}
        gate.hidden = true; gate.innerHTML = "";
        resolve(b.dataset.who);
      });
    });
  }

  function askPassword() {
    return new Promise(function (resolve) {
      if (!BASE_CAMP_PASSWORD) return resolve(true);
      var ok = false;
      try { ok = localStorage.getItem("basecamp.pw") === BASE_CAMP_PASSWORD; } catch (e) {}
      if (ok) return resolve(true);
      var gate = el("gate");
      gate.hidden = false;
      gate.innerHTML =
        '<div class="gate-box"><h2>Base Camp</h2>' +
        '<p>Plan + Pivot Collective, internal.</p>' +
        '<div class="gate-row"><input type="password" id="pwInput" placeholder="Password" autocomplete="current-password">' +
        '<button class="btn" id="pwGo" type="button">Enter</button></div>' +
        '<p class="gate-err" id="pwErr" hidden>Not it. Try again.</p></div>';
      function attempt() {
        var v = el("pwInput").value;
        if (v === BASE_CAMP_PASSWORD) {
          try { localStorage.setItem("basecamp.pw", v); } catch (e) {}
          gate.hidden = true; gate.innerHTML = ""; resolve(true);
        } else {
          el("pwErr").hidden = false; el("pwInput").value = ""; el("pwInput").focus();
        }
      }
      gate.addEventListener("click", function (e) { if (e.target.id === "pwGo") attempt(); });
      gate.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); attempt(); } });
      setTimeout(function () { var i = el("pwInput"); if (i) i.focus(); }, 50);
    });
  }

  (async function init() {
    await askPassword();

    var configured = SUPABASE_URL.indexOf("YOUR-PROJECT") === -1 &&
                     SUPABASE_ANON_KEY.indexOf("YOUR-ANON-KEY") === -1;

    if (!configured || !window.supabase) {
      applySeed();
      banner(!configured
        ? "Not connected to Supabase yet. Fill in SUPABASE_URL and SUPABASE_ANON_KEY at the top of this file. Until then this is a read-only snapshot."
        : "Couldn\u2019t load the Supabase library, so this is a read-only snapshot.");
      renderAll();
      return;
    }

    var whoKey = await askWho();
    user = {
      _id: whoKey,
      profiles: function (ids) {
        var out = {};
        (ids || []).forEach(function (i) { out[i] = { name: PEOPLE[i] || "Someone" }; });
        return Promise.resolve(out);
      }
    };
    el("whoami").innerHTML = "You\u2019re in as <b>" + esc(PEOPLE[whoKey]) + "</b>";

    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    db = supaDb(sb);
    banner(null);

    db.collection("agenda").onSnapshot(function (snap) {
      state.agenda = withSeed(collect(snap), "agenda");
      refreshProfiles().then(renderAll);
    });
    db.collection("clients").onSnapshot(function (snap) {
      state.clients = withSeed(collect(snap), "clients"); renderAll();
    });
    db.collection("prospects").onSnapshot(function (snap) {
      state.prospects = withSeed(collect(snap), "prospects"); renderAll();
    });
    db.doc("meta/refresh").onSnapshot(function (snap) {
      state.refresh = snap.exists ? snap.data() : null; renderRefresh();
    });
  })();
})();
</script>

</body>
</html>
